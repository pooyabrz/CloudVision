services:
  api:
    build: .
    image: cloudvision:local
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
  dashboard:
    image: cloudvision:local
    pull_policy: never
    command: ["python", "-m", "streamlit", "run", "app/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      CLOUDVISION_API: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
