name: CloudVision checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src api app scripts tests
      - run: python -m pytest -q
      - run: docker compose config --quiet
      - run: docker compose build api
      - run: docker compose up -d --wait --wait-timeout 150
      - run: curl --fail http://localhost:8000/health && curl --fail http://localhost:8501/_stcore/health
      - if: always()
        run: docker compose down
